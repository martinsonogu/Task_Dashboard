services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task_dashboard
      POSTGRES_USER: task_app
      POSTGRES_PASSWORD: task_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_app -d task_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://task_app:task_app_password@postgres:5432/task_dashboard
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data: