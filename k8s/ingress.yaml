apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-dashboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: task-dashboard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: task-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-frontend
                port:
                  name: http
